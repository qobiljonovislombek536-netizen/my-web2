<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .islom-3{
             
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
        }
        
             input[type="text"],
        input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        label{
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
           .islom-2{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
              cursor: pointer;
              color: blue;

           }
            .ISLOM-5-btn{
                padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            }
    </style>
</head>
<body>
    <div class="islom-3">
    <P class="islom-2">
        Change your password
    </P>
      <Label>
        Username
      </Label>
      <input type="text" placeholder="Enter your Username">
      <Label>
        Change your password
      </Label>
      <input type="password" placeholder="change your password">
      <label>
        confirm password
      </label>
      <input type="password" placeholder="confirm password">
      <a href="index.html" class="ISLOM-5-btn" style="text-decoration: none; display: block; text-align: center;">login</a>
    </div>
</body>
</html>
