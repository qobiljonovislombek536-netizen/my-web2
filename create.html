<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .gender-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-login {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username">
            </div>
            
            <div class="form-group">
                <label for="password">Create your password</label>
                <input type="password" id="password" placeholder="Create your password">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-group">
                    <label>
                        <input type="radio" name="gender" value="erkak" checked> ERKAK
                    </label>
                    <label>
                        <input type="radio" name="gender" value="ayol"> AYOL
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthday">Date of birthday</label>
                <input type="date" id="birthday">
            </div>

             <a href="./index.html" class="btn-login">Login</a>
        </form>
    </div>
</body>
</html>
