<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
        }

        .islom-3 {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2b569a;
            margin-bottom: 10px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            font-size: 14px;
            cursor: pointer;
        }

        .ISLOM-5-btn {
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .ISLOM-5 {
            font-size: 13px;
            color: #555;
            margin: 2px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
              
    <div class="islom-3">
         
        <h2 class="title">ACCOUNT LOGIN</h2>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="enter your username">

        <label for="password">Enter your password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <label class="checkbox-label">
            <input type="checkbox"> Remember Me
        </label>

      <a href="index.html.html" class="ISLOM-5-btn" style="text-decoration: none; display: block; text-align: center;">login</a>
         <a href="create.html" class="ISLOM-5-btn" style="text-decoration: none; display: block; text-align: center;">Dont have an Account</a>
          <a href="Changepassword.html" class="ISLOM-5-btn" style="text-decoration: none; display: block; text-align: center;">Forget password</a>
    </div>

</body>
</html>
